<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiens en pension – Pension Canine de La Prêlée</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f9f9f9;
      color: #333;
      line-height: 1.6;
    }

    /* Navigation simple */
    nav {
      background: rgba(56, 142, 60, 0.95);
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    section {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #4CAF50;
    }

    p {
      max-width: 800px;
      margin: 0 auto 30px auto;
      font-size: 1.1em;
    }

    /* Galerie */
    .galerie {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
  margin-top: 30px;
}

.chien {
  text-align: center;
}

.nom-chien {
  display: inline-block;
  margin-bottom: 8px;
  padding: 6px 14px;
  background: rgba(76, 175, 80, 0.85);
  color: white;
  font-weight: bold;
  border-radius: 20px;
  font-size: 0.95em;
}

.chien img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}

    .galerie img {
      width: 100%;
      height: 500px;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #2E7D32;
      color: white;
      margin-top: 40px;
    }

    /* Mobile */
    @media (max-width: 768px) {
      p {
        font-size: 1em;
      }

      .galerie img {
        height: 180px;
      }
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">Retour à l'accueil</a>
</nav>

<section>
  <h1>Hébergement</h1>

  <p>
    Découvrez quelques photos de nos locaux (en amélioration permanente)
  </p>

  <div class="galerie">
  <div class="chien">
    <span class="nom-chien">Parc de 160 m2</span>
    <img src="images/phototheque/exterieur/parc.jpg" alt="BOX">
  </div>
  
   <div class="chien">
    <span class="nom-chien">5 courettes entre 30 m2 et 50 m2</span>
    <img src="images/phototheque/exterieur/courette.jpg" alt="BOX">
  </div>

</section>

<footer>
  © 2025 Pension Canine de La Prêlée
</footer>

</body>
</html>
