conditions_content: |
  Vaccins obligatoires : CHPPiLR, Pneumodog (C, H, P, L)
  Identification obligatoire (tatouage ou puce électronique)
  Traitement antiparasitaire à jour (puces, tiques, vermifuge)
  Nourriture à fournir par le propriétaire
