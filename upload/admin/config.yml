backend:
  name: git-gateway
  branch: main

media_folder: "images/actualites"
public_folder: "/images/actualites"

collections:
  - name: "actualites"
    label: "Actualités"
    folder: "actualites"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Type", name: "type", widget: "select", options: ["info", "fermeture", "nouveaute"]}
      - {label: "Icône", name: "icon", widget: "select", options: ["⚠️", "🔨", "🏡", "📢", "✅", "❌"]}
      - {label: "Couleur", name: "color", widget: "select", options: ["#ff9800", "#d32f2f", "#4caf50", "#2196f3"]}
      - {label: "Date de publication", name: "date", widget: "datetime"}
      - {label: "Actif", name: "active", widget: "boolean", default: true}
      - {label: "Contenu", name: "body", widget: "markdown"}